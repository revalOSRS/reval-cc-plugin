name: Plugin tests

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAVA_TOOL_OPTIONS: -Djava.awt.headless=true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # Compile local launchers without starting RuneLite. Tests use temporary profiles and
      # loopback servers; no production credential or real client profile is supplied.
      - run: ./gradlew --no-daemon compileJava compileTestJava compileDevJava test jar
