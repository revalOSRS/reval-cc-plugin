plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

// Local launchers are separate from the distributable plugin.
sourceSets {
	dev {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	devImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	devImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.revalclan'
// runelite-plugin.properties is the single source of truth for the plugin version:
// the jar is named after it and PluginVersion reads it at runtime (User-Agent).
def pluginProperties = new Properties()
file('runelite-plugin.properties').withInputStream { pluginProperties.load(it) }
version = pluginProperties.getProperty('version')

processResources {
	// Ship the properties file so PluginVersion can read the version at runtime.
	// A real task input, so bumping the version re-stamps the jar without a clean.
	from('runelite-plugin.properties') { into 'com/revalclan' }
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.devRuntimeClasspath
	manifest {
		attributes('Main-Class': 'com.revalclan.RevalClanDevClient', 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.dev.output
	from {
		configurations.devRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

// Dev client: JAVA_HOME=$(/usr/libexec/java_home -v 21) ./gradlew runClient
tasks.register('runClient', JavaExec) {
	group = 'application'
	description = 'Launch RuneLite with the plugin loaded (developer mode)'
	classpath = sourceSets.dev.runtimeClasspath
	mainClass = 'com.revalclan.RevalClanDevClient'
	jvmArgs = ['-ea', '-Xmx1g', '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED', '--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED']
	args = ['--developer-mode']
}

tasks.register('runRaceClient', JavaExec) {
	group = 'application'
	description = 'Launch RuneLite on the Competitions tab with the real featured race'
	classpath = sourceSets.dev.runtimeClasspath
	mainClass = 'com.revalclan.races.RaceClientPreview'
	jvmArgs = ['-ea', '-Xmx1g', '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED', '--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED']
	args = ['--developer-mode']
	if (project.hasProperty('revalRaceScreenshot')) systemProperty('reval.raceScreenshot', project.property('revalRaceScreenshot'))
	if (project.hasProperty('revalRaceDemo')) systemProperty('reval.raceDemo', project.property('revalRaceDemo'))
	if (project.hasProperty('revalRaceNoImage')) systemProperty('reval.raceNoImage', project.property('revalRaceNoImage'))
}

tasks.register('checkRaceCardLayout', JavaExec) {
	group = 'verification'
	description = 'Check race inventory icon bounds and party layout in narrow sidebars'
	classpath = sourceSets.dev.runtimeClasspath
	mainClass = 'com.revalclan.races.RaceCardLayoutCheck'
	systemProperty('java.awt.headless', 'true')
}
tasks.named('check') { dependsOn tasks.named('checkRaceCardLayout') }

// Native clan-browser previews. API override is for a local read-only development server.
['runBrowserPreview': 'com.revalclan.clanbrowser.BrowserDesktopPreview',
 'runBrowserClient': 'com.revalclan.clanbrowser.BrowserClientPreview'].each { taskName, entrypoint ->
	tasks.register(taskName, JavaExec) {
		group = 'application'
		classpath = sourceSets.dev.runtimeClasspath
		mainClass = entrypoint
		jvmArgs = ['-ea', '-Xmx1g', '--add-exports=java.desktop/com.apple.eawt=ALL-UNNAMED', '--add-opens=java.desktop/com.apple.eawt=ALL-UNNAMED']
		if (taskName == 'runBrowserClient') args = ['--developer-mode']
		['Api', 'Command', 'Atlas', 'Screenshot'].each { suffix ->
			if (project.hasProperty('revalBrowser' + suffix)) systemProperty('reval.browser' + suffix, project.property('revalBrowser' + suffix))
		}
	}
}
