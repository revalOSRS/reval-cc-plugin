plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'

dependencies {
	compileOnly group: 'net.runelite', name:'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation 'junit:junit:4.12'
	testImplementation group: 'net.runelite', name:'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name:'jshell', version: runeLiteVersion
}

group = 'com.revalclan'
// runelite-plugin.properties is the single source of truth for the plugin version:
// the jar is named after it and PluginVersion reads it at runtime (User-Agent).
def pluginProperties = new Properties()
file('runelite-plugin.properties').withInputStream { pluginProperties.load(it) }
version = pluginProperties.getProperty('version')

processResources {
	// Ship the properties file so PluginVersion can read the version at runtime.
	// A real task input, so bumping the version re-stamps the jar without a clean.
	from('runelite-plugin.properties') { into 'com/revalclan' }
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

tasks.register('shadowJar', Jar) {
	dependsOn configurations.testRuntimeClasspath
	manifest {
		attributes('Main-Class': 'com.revalclan.RevalClanPluginTest', 'Multi-Release': true)
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	from sourceSets.main.output
	from sourceSets.test.output
	from {
		configurations.testRuntimeClasspath.collect { file ->
			file.isDirectory() ? file : zipTree(file)
		}
	}

	exclude 'META-INF/INDEX.LIST'
	exclude 'META-INF/*.SF'
	exclude 'META-INF/*.DSA'
	exclude 'META-INF/*.RSA'
	exclude '**/module-info.class'

	group = BasePlugin.BUILD_GROUP
	archiveClassifier.set('shadow')
	archiveFileName.set("${rootProject.name}-${project.version}-all.jar")
}

// Dev client: ./gradlew runClient  (JDK 21). Loads the plugin as a builtin via RevalClanPluginTest.
tasks.register('runClient', JavaExec) {
	group = 'application'
	description = 'Launches the RuneLite dev client with the Reval plugin loaded'
	classpath = sourceSets.test.runtimeClasspath
	mainClass.set('com.revalclan.RevalClanPluginTest')
	args '--developer-mode'
	jvmArgs '-ea'
	if (System.getProperty('os.name').toLowerCase().contains('mac')) {
		// RuneLite's OSX adapters extend com.apple.eawt classes that java.desktop
		// doesn't export on JDK 17+; the official launcher passes the same flags.
		jvmArgs '--add-exports', 'java.desktop/com.apple.eawt=ALL-UNNAMED',
			'--add-exports', 'java.desktop/com.apple.eawt.event=ALL-UNNAMED',
			'--add-opens', 'java.desktop/com.apple.eawt=ALL-UNNAMED',
			'--add-opens', 'java.desktop/sun.awt=ALL-UNNAMED'
	}
}
